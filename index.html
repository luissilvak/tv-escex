<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TV da secretaria</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
:root {
  --noite: #050d1c; --tinta: #eaf0fa; --nevoa: #9fb0cc; --ceu: #8db8f0;
  --f-titulo: "Archivo", Roboto, Arial, sans-serif;
  --f-texto: "Source Sans 3", "Segoe UI", Roboto, Arial, sans-serif;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; overflow: hidden; background: #000; }
body { color: var(--tinta); font-family: var(--f-texto); cursor: none; }
video, iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; background: #000; }
video { object-fit: contain; }
.camada { position: fixed; inset: 0; display: flex; flex-direction: column; justify-content: center; padding: 0 8vw; background: var(--noite); transition: opacity .6s ease, visibility 0s linear 0s; }
.oculta { opacity: 0; visibility: hidden; transition: opacity .6s ease, visibility 0s linear .6s; }
.rotulo { font-size: 1.8vw; font-weight: 600; color: var(--ceu); }
.titulo { max-width: 80vw; margin: 1.2vw 0 1.4vw; font-family: var(--f-titulo); font-weight: 800; font-stretch: 85%; line-height: 1.04; text-wrap: balance; }
.vinheta .titulo { opacity: 0; transform: translateY(1.2vw); transition: opacity .6s ease .2s, transform .6s ease .2s; }
.vinheta.rodando .titulo { opacity: 1; transform: none; }
.t-g { font-size: 6.2vw; } .t-m { font-size: 4.7vw; } .t-p { font-size: 3.7vw; }
.serie { font-size: 1.7vw; color: var(--nevoa); }
.linha { width: 26vw; height: .4vw; margin-top: 3vw; background: rgba(255, 255, 255, .12); border-radius: 1vw; overflow: hidden; }
.linha div { width: 0; height: 100%; background: var(--ceu); }
.vinheta.rodando .linha div { animation: encher 3.2s linear forwards; }
@keyframes encher { to { width: 100%; } }
.texto { max-width: 60vw; font-size: 1.8vw; line-height: 1.4; color: var(--nevoa); }
.assinatura { position: absolute; right: 4vw; bottom: 3.4vw; display: flex; align-items: center; gap: 2.4vw; }
.assinatura img { display: block; height: max(40px, 4vw); width: auto; }
.assinatura span { width: 1px; height: 3.2vw; background: rgba(255, 255, 255, .28); }
.noticia { display: block; padding: 0; overflow: hidden; }
.not-foto { position: absolute; top: 0; bottom: 0; left: 0; width: 56%; background: #000; }
.not-foto img { display: block; width: 100%; height: 100%; object-fit: cover; }
.not-foto.conter img { object-fit: contain; }
.not-painel { position: absolute; top: 0; bottom: 0; right: 0; width: 44%; display: flex; flex-direction: column; gap: 1.3vw; padding: 3.6vw 3.6vw 3vw; }
.not-meta { display: flex; flex-wrap: wrap; align-items: baseline; gap: .4vw 1.2vw; font-size: 1.25vw; }
.not-rotulo { font-weight: 600; color: var(--ceu); }
.not-fonte { font-weight: 700; }
.not-data { color: var(--nevoa); }
.not-titulo { font-family: var(--f-titulo); font-weight: 800; font-stretch: 88%; line-height: 1.06; text-wrap: balance; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
.n-g { font-size: 3.6vw; } .n-m { font-size: 3vw; } .n-p { font-size: 2.5vw; }
.not-resumo { margin: 0; font-size: 1.5vw; line-height: 1.4; color: var(--nevoa); display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
.not-titulo, .not-resumo { transition: opacity .5s ease .1s, transform .5s ease .1s; }
.noticia:not(.rodando) .not-titulo, .noticia:not(.rodando) .not-resumo { opacity: 0; transform: translateY(1vw); }
.not-qr-linha { margin-top: auto; display: flex; align-items: center; gap: 1.4vw; }
.not-qr { flex: none; width: 8vw; padding: .5vw; background: #fff; border-radius: .5vw; line-height: 0; }
.not-qr svg { display: block; width: 100%; height: auto; }
.not-qr-linha span { font-size: 1.15vw; line-height: 1.35; color: var(--nevoa); }
.noticia.sem-link .not-qr-linha { display: none; }
.not-tempo { position: absolute; left: 0; right: 0; bottom: 0; height: .4vw; background: rgba(255, 255, 255, .12); }
.not-tempo div { width: 0; height: 100%; background: var(--ceu); }
.noticia.rodando .not-tempo div { animation: encher var(--seg, 12s) linear forwards; }
.not-assinatura { display: none; }
.layout-manchete .not-foto { width: 100%; }
.layout-manchete .not-painel { top: auto; left: 0; width: auto; display: grid; grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "meta qr" "titulo qr" "resumo qr"; gap: .8vw 3vw; padding: 2.4vw 4vw 2.8vw; background: rgba(5, 13, 28, .9); }
.layout-manchete .not-meta { grid-area: meta; }
.layout-manchete .not-titulo { grid-area: titulo; -webkit-line-clamp: 2; }
.layout-manchete .not-resumo { grid-area: resumo; -webkit-line-clamp: 2; }
.layout-manchete .not-qr-linha { grid-area: qr; margin: 0; flex-direction: column; align-self: center; gap: .6vw; text-align: center; }
.layout-manchete .not-qr-linha span { max-width: 11vw; font-size: 1vw; }
.layout-manchete .n-g { font-size: 3.4vw; } .layout-manchete .n-m { font-size: 2.9vw; } .layout-manchete .n-p { font-size: 2.4vw; }
.layout-destaque .not-foto { display: none; }
.layout-destaque .not-painel { left: 0; width: auto; justify-content: center; gap: 1.6vw; padding: 5vw 8vw 8vw; }
.layout-destaque .not-titulo { max-width: 72vw; -webkit-line-clamp: 3; }
.layout-destaque .n-g { font-size: 5.4vw; } .layout-destaque .n-m { font-size: 4.4vw; } .layout-destaque .n-p { font-size: 3.6vw; }
.layout-destaque .not-resumo { max-width: 60vw; font-size: 2vw; -webkit-line-clamp: 3; }
.layout-destaque .not-qr-linha { margin-top: 1.4vw; }
.layout-destaque .not-assinatura { position: absolute; right: 4vw; bottom: 3.4vw; display: flex; align-items: center; gap: 2.4vw; }
.not-assinatura img { display: block; height: max(40px, 4vw); width: auto; }
.not-assinatura span { width: 1px; height: 3.2vw; background: rgba(255, 255, 255, .28); }
@media (prefers-reduced-motion: reduce) {
  .camada, .oculta, .vinheta .titulo { transition: none; }
  .vinheta.rodando .linha div { animation: none; width: 100%; }
  .not-titulo, .not-resumo { transition: none; }
  .noticia.rodando .not-tempo div { animation: none; width: 100%; }
}
</style>
</head>
<body>
<video id="video" playsinline preload="auto" muted></video>
<iframe id="agenda" class="oculta" title="Agenda da secretaria" src="about:blank"></iframe>

<div class="camada vinheta oculta" id="vinheta">
  <div class="rotulo">A seguir</div>
  <div class="titulo t-m" id="vin-titulo"></div>
  <div class="serie" id="vin-serie"></div>
  <div class="linha"><div></div></div>
  <div class="assinatura"><img data-marca="logoEscuro" alt="ESCEX"><span></span><img data-marca="brasaoEscuro" alt="Tribunal de Contas do Estado do Maranhão"></div>
</div>

<div class="camada noticia layout-jornal oculta" id="noticia">
  <div class="not-foto"><img alt=""></div>
  <div class="not-painel">
    <div class="not-meta"><span class="not-rotulo"></span><span class="not-fonte"></span><span class="not-data"></span></div>
    <div class="not-titulo n-m"></div>
    <p class="not-resumo"></p>
    <div class="not-qr-linha"><div class="not-qr" aria-hidden="true"></div><span>Aponte a câmera do celular para ler a notícia completa</span></div>
  </div>
  <div class="not-assinatura"><img data-marca="logoEscuro" alt="ESCEX"><span></span><img data-marca="brasaoEscuro" alt="Tribunal de Contas do Estado do Maranhão"></div>
  <div class="not-tempo"><div></div></div>
</div>

<div class="camada" id="aviso">
  <div class="titulo t-m" id="aviso-titulo">Preparando a programação</div>
  <div class="texto" id="aviso-texto"></div>
  <div class="assinatura"><img data-marca="logoEscuro" alt="ESCEX"><span></span><img data-marca="brasaoEscuro" alt="Tribunal de Contas do Estado do Maranhão"></div>
</div>

<script>//---------------------------------------------------------------------
//

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      if (_typeNumber < 1) {
        var typeNumber = 1;

        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {
            totalDataCount += rsBlocks[i].dataCount;
          }

          if (buffer.getLengthInBits() <= totalDataCount * 8) {
            break;
          }
        }

        _typeNumber = typeNumber;
      }

      makeImpl(false, getBestMaskPattern() );
    };

    _this.createTableTag = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var qrHtml = '';

      qrHtml += '<table style="';
      qrHtml += ' border-width: 0px; border-style: none;';
      qrHtml += ' border-collapse: collapse;';
      qrHtml += ' padding: 0px; margin: ' + margin + 'px;';
      qrHtml += '">';
      qrHtml += '<tbody>';

      for (var r = 0; r < _this.getModuleCount(); r += 1) {

        qrHtml += '<tr>';

        for (var c = 0; c < _this.getModuleCount(); c += 1) {
          qrHtml += '<td style="';
          qrHtml += ' border-width: 0px; border-style: none;';
          qrHtml += ' border-collapse: collapse;';
          qrHtml += ' padding: 0px; margin: 0px;';
          qrHtml += ' width: ' + cellSize + 'px;';
          qrHtml += ' height: ' + cellSize + 'px;';
          qrHtml += ' background-color: ';
          qrHtml += _this.isDark(r, c)? '#000000' : '#ffffff';
          qrHtml += ';';
          qrHtml += '"/>';
        }

        qrHtml += '</tr>';
      }

      qrHtml += '</tbody>';
      qrHtml += '</table>';

      return qrHtml;
    };

    _this.createSvgTag = function(cellSize, margin, alt, title) {

      var opts = {};
      if (typeof arguments[0] == 'object') {
        // Called by options.
        opts = arguments[0];
        // overwrite cellSize and margin.
        cellSize = opts.cellSize;
        margin = opts.margin;
        alt = opts.alt;
        title = opts.title;
      }

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      // Compose alt property surrogate
      alt = (typeof alt === 'string') ? {text: alt} : alt || {};
      alt.text = alt.text || null;
      alt.id = (alt.text) ? alt.id || 'qrcode-description' : null;

      // Compose title property surrogate
      title = (typeof title === 'string') ? {text: title} : title || {};
      title.text = title.text || null;
      title.id = (title.text) ? title.id || 'qrcode-title' : null;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var c, mc, r, mr, qrSvg='', rect;

      rect = 'l' + cellSize + ',0 0,' + cellSize +
        ' -' + cellSize + ',0 0,-' + cellSize + 'z ';

      qrSvg += '<svg version="1.1" xmlns="http://www.w3.org/2000/svg"';
      qrSvg += !opts.scalable ? ' width="' + size + 'px" height="' + size + 'px"' : '';
      qrSvg += ' viewBox="0 0 ' + size + ' ' + size + '" ';

<script>
(function () {
  'use strict';

  var VINHETA_MS = 3200;
  var BATIDA_MS = 20000;
  var PROGRAMACAO_MS = 5 * 60000;
  var TRAVADO_MS = 45000;
  var CACHE = 'tv-escex-videos-v1';

  var $ = function (s) { return document.querySelector(s); };
  var video = $('#video'), agenda = $('#agenda'), vinheta = $('#vinheta'), aviso = $('#aviso'), noticiaEl = $('#noticia');

  var marcas = JSON.parse($('#marcas').textContent);
  Array.prototype.forEach.call(document.querySelectorAll('img[data-marca]'), function (img) {
    img.src = marcas[img.dataset.marca] || '';
  });

  // ---------- ligação com o sistema (vem no link da TV e fica guardada no aparelho) ----------
  function lerLocal(k) { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } }
  function gravarLocal(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* sem armazenamento */ } }
  var params = new URLSearchParams(location.search);
  var conf = { api: params.get('api') || lerLocal('tv.api'), chave: params.get('chave') || lerLocal('tv.chave') };
  if (params.get('api')) gravarLocal('tv.api', conf.api);
  if (params.get('chave')) gravarLocal('tv.chave', conf.chave);

  var prog = { versao: null, config: {}, videos: [] };
  try {
    var salvo = JSON.parse(lerLocal('tv.programacao') || 'null');
    if (salvo && salvo.videos) prog = salvo;
  } catch (e) { /* ignora programação guardada com defeito */ }

  var tv = { fase: 'carregando', atualId: null, timer: null, objUrl: null, origem: '', falhas: {}, forcado: false, avisoSom: false, ultimoTempo: -1, ultimoAvanco: Date.now(), erroProgramacao: '' };
  var baixa = { prontos: {}, erros: {}, atual: null, pct: 0, ocupado: false, semEspaco: false };
  var inicio = Date.now();

  function endereco(dados) {
    var sep = conf.api.indexOf('?') >= 0 ? '&' : '?';
    return conf.api + sep + Object.keys(dados).map(function (k) {
      return encodeURIComponent(k) + '=' + encodeURIComponent(dados[k]);
    }).join('&');
  }
  function porId(id) {
    for (var i = 0; i < prog.videos.length; i++) if (prog.videos[i].id === id) return prog.videos[i];
    return null;
  }
  function falhou(id) { return !!tv.falhas[id] && Date.now() - tv.falhas[id] < 30 * 60000; }
  function urlDrive(id) {
    return 'https://www.googleapis.com/drive/v3/files/' + encodeURIComponent(id) + '?alt=media&key=' + encodeURIComponent(prog.config.driveApiKey || '');
  }
  function chaveCache(v) { return new Request(new URL('__videos/' + v.id + '-' + (v.tamanho || 0), location.href).href); }
  function classeTitulo(t) { return t.length <= 30 ? 't-g' : t.length <= 55 ? 't-m' : 't-p'; }

  // ---------- camadas ----------
  function mostrar(el) { el.classList.remove('oculta'); }
  function esconder(el) { el.classList.add('oculta'); }
  function mostrarAviso(titulo, texto) {
    var t = $('#aviso-titulo');
    t.textContent = titulo;
    t.className = 'titulo ' + classeTitulo(titulo);
    $('#aviso-texto').textContent = texto || '';
    mostrar(aviso); esconder(vinheta); esconder(agenda); esconder(noticiaEl);
  }
  function liberarObjUrl() {
    if (tv.objUrl) { URL.revokeObjectURL(tv.objUrl); tv.objUrl = null; }
  }
  function pararVideo() {
    video.pause();
    video.removeAttribute('src');
    video.load();
    liberarObjUrl();
  }

  // ---------- programação ----------
  function carregarProgramacao() {
    if (!conf.api || !conf.chave) {
      tv.fase = 'config';
      mostrarAviso('Falta ligar esta TV ao sistema', 'Abra esta página pelo “Link da TV” que aparece na tela administrativa.');
      return Promise.resolve();
    }
    return fetch(endereco({ api: 'programacao', chave: conf.chave }), { cache: 'no-store' })
      .then(function (r) { return r.json(); })
      .then(function (dados) {
        if (dados.erro) throw new Error(dados.erro);
        var mudou = dados.versao !== prog.versao;
        prog = dados;
        gravarLocal('tv.programacao', JSON.stringify(prog));
        tv.erroProgramacao = '';
        if (mudou) tv.falhas = {};
        preCarregarFotos();
        sincronizarCache();
        retomar();
      })
      .catch(function (e) {
        tv.erroProgramacao = 'Sem acesso à programação (' + e.message + ').';
        retomar();
      });
  }

  function retomar() {
    if (['carregando', 'vazio', 'config', 'semprog', 'semchave'].indexOf(tv.fase) >= 0) proximo();
  }

  function agendaLigada() {
    return prog.config.agendaMin > 0 && /^https:\/\//.test(prog.config.agendaUrl || '');
  }

  // Escolhe o próximo vídeo marcado "Na TV" depois do atual; no fim da rodada, mostra a agenda (se estiver ligada).
  function proximo(forcarId) {
    clearTimeout(tv.timer);
    tv.forcado = !!forcarId;
    if (!forcarId && !dentroDoHorario()) { foraDoHorario(); return; }
    var item = forcarId ? porId(forcarId) : null;
    if (!item) {
      var lista = prog.videos.filter(function (v) { return v.ativo !== false && !falhou(v.id); });
      if (!lista.length) {
        pararVideo();
        tv.atualId = null;
        if (!prog.videos.length && tv.erroProgramacao) {
          tv.fase = 'semprog';
          mostrarAviso('Sem conexão com a programação', 'A TV tenta de novo sozinha em instantes.');
        } else {
          tv.fase = 'vazio';
          mostrarAviso('Nenhum vídeo na programação', 'Marque “Na TV” em algum vídeo na tela administrativa.');
        }
        return;
      }
      if (!prog.config.driveApiKey) {
        pararVideo();
        tv.fase = 'semchave';
        mostrarAviso('Falta a chave do Google Drive', 'Informe a chave na tela administrativa, em “Ligação com a TV”.');
        return;
      }
      var ordem = prog.videos, pos = -1, voltou = false;
      for (var k = 0; k < ordem.length; k++) if (ordem[k].id === tv.atualId) pos = k;
      for (var passo = 1; passo <= ordem.length; passo++) {
        var idx = pos + passo;
        if (idx >= ordem.length) voltou = true;
        var cand = ordem[idx % ordem.length];
        if (cand.ativo !== false && !falhou(cand.id)) { item = cand; break; }
      }
      if (voltou && tv.atualId && agendaLigada()) { mostrarAgenda(); return; }
    }
    abrirVinheta(item);
  }

  function mostrarAgenda() {
    pararVideo();
    tv.fase = 'agenda';
    tv.atualId = null;
    agenda.src = prog.config.agendaUrl;
    mostrar(agenda); esconder(vinheta); esconder(aviso); esconder(noticiaEl);
    batida();
    tv.timer = setTimeout(function () {
      esconder(agenda);
      setTimeout(function () { if (tv.fase !== 'agenda') agenda.src = 'about:blank'; }, 800);
      proximo();
    }, prog.config.agendaMin * 60000);
  }

  function abrirVinheta(item) {
    tv.atualId = item.id;
    esconder(aviso); esconder(agenda); esconder(noticiaEl);
    if (prog.config.vinheta === false) { tocar(item); return; }
    tv.fase = 'vinheta';
    video.pause();
    var t = $('#vin-titulo');
    t.textContent = item.titulo;
    t.className = 'titulo ' + classeTitulo(item.titulo);
    $('#vin-serie').textContent = item.serie || '';
    vinheta.classList.remove('rodando');
    void vinheta.offsetWidth;
    vinheta.classList.add('rodando');
    mostrar(vinheta);
    var fonteP = fonte(item);
    batida();
    tv.timer = setTimeout(function () { tocar(item, fonteP); }, VINHETA_MS);
  }

  // Usa a cópia guardada no aparelho; se ainda não houver, toca direto do Drive.
  function fonte(item) {
    if (!('caches' in window) || !baixa.prontos[item.id]) return Promise.resolve(urlDrive(item.id));
    return caches.open(CACHE)
      .then(function (c) { return c.match(chaveCache(item)); })
      .then(function (r) { return r ? r.blob() : null; })
      .then(function (b) { return b && b.size ? URL.createObjectURL(b) : urlDrive(item.id); })
      .catch(function () { return urlDrive(item.id); });
  }

  function tocar(item, fonteP) {
    tv.fase = 'video';
    tv.atualId = item.id;
    tv.ultimoTempo = -1;
    tv.ultimoAvanco = Date.now();
    (fonteP || fonte(item)).then(function (src) {
      var ehBlob = src.indexOf('blob:') === 0;
      if (tv.fase !== 'video' || tv.atualId !== item.id) { if (ehBlob) URL.revokeObjectURL(src); return; }
      var anterior = tv.objUrl;
      tv.objUrl = ehBlob ? src : null;
      tv.origem = ehBlob ? 'cache' : 'rede';
      video.src = src;
      if (anterior) URL.revokeObjectURL(anterior);
      video.muted = !prog.config.som;
      reproduzir();
      setTimeout(function () { if (tv.fase === 'video') esconder(vinheta); }, 4000);
    });
  }

  function reproduzir() {
    var p = video.play();
    if (p && p.catch) {
      p.catch(function (e) {
        if (e && e.name === 'NotAllowedError' && !video.muted) {
          tv.avisoSom = true;
          video.muted = true;
          video.play().catch(function () {});
        }
      });
    }
  }

  function falhaDeReproducao(motivo) {
    var item = porId(tv.atualId);
    if (!item) { proximo(); return; }
    if (tv.origem === 'cache') {
      // cópia guardada com defeito: apaga e tenta direto do Drive
      tv.origem = 'rede';
      delete baixa.prontos[item.id];
      if ('caches' in window) caches.open(CACHE).then(function (c) { return c.delete(chaveCache(item)); }).catch(function () {});
      var anterior = tv.objUrl;
      tv.objUrl = null;
      video.src = urlDrive(item.id);
      if (anterior) URL.revokeObjectURL(anterior);
      reproduzir();
      return;
    }
    tv.falhas[item.id] = Date.now();
    tv.motivo = motivo;
    batida();
    proximo();
  }

  video.addEventListener('ended', function () {
    if (tv.fase !== 'video') return;
    var lote = dentroDoHorario() ? proximasNoticias() : [];
    if (lote.length) mostrarNoticias(lote, function () { proximo(); });
    else proximo();
  });
  video.addEventListener('playing', function () { if (tv.fase === 'video') esconder(vinheta); });
  video.addEventListener('timeupdate', function () {
    if (video.currentTime !== tv.ultimoTempo) { tv.ultimoTempo = video.currentTime; tv.ultimoAvanco = Date.now(); }
  });
  video.addEventListener('error', function () {
    if (tv.fase !== 'video' || !video.getAttribute('src')) return;
    falhaDeReproducao(video.error ? 'erro ' + video.error.code : 'erro');
  });

  // vídeo parado há muito tempo: tenta de novo ou passa para o próximo
  setInterval(function () {
    if (tv.fase !== 'video' || Date.now() - tv.ultimoAvanco < TRAVADO_MS) return;
    tv.ultimoAvanco = Date.now();
    if (video.paused && video.readyState >= 2) reproduzir();
    else falhaDeReproducao('travou');
  }, 10000);

  // ---------- notícias ----------
  var qrCache = {};
  var notIdx = 0;
  if (typeof qrcode === 'function' && qrcode.stringToBytesFuncs) qrcode.stringToBytes = qrcode.stringToBytesFuncs['UTF-8'];

  function qrSvg(url) {
    if (!url || typeof qrcode !== 'function') return '';
    if (qrCache[url] === undefined) {
      try {
        var q = qrcode(0, 'M');
        q.addData(url);
        q.make();
        qrCache[url] = q.createSvgTag({ cellSize: 4, margin: 0, scalable: true });
      } catch (e) {
        qrCache[url] = '';
      }
    }
    return qrCache[url];
  }
  function porIdNoticia(id) {
    var l = prog.noticias || [];
    for (var i = 0; i < l.length; i++) if (l[i].id === id) return l[i];
    return null;
  }
  function segundosNoticia() { return Math.min(60, Math.max(5, Number(prog.config.noticiasSeg) || 12)); }
  function preCarregarFotos() {
    (prog.noticias || []).forEach(function (n) { if (n.imagem && n.ativo !== false) { var im = new Image(); im.src = n.imagem; } });
  }

  // as próximas do rodízio: cada intervalo continua de onde o anterior parou
  function proximasNoticias() {
    var lista = (prog.noticias || []).filter(function (n) { return n.ativo !== false; });
    var qtd = Number(prog.config.noticiasQtd) || 0;
    if (!lista.length || qtd < 1) return [];
    var lote = [];
    for (var k = 0; k < Math.min(qtd, lista.length); k++) lote.push(lista[(notIdx + k) % lista.length]);
    notIdx = (notIdx + lote.length) % lista.length;
    return lote;
  }

  function dataPorExtenso(iso) {
    var p = String(iso).split('-');
    if (p.length !== 3) return '';
    return new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2])).toLocaleDateString('pt-BR', { day: 'numeric', month: 'long', year: 'numeric' });
  }

  function desenharCartao(n, pos, total) {
    var el = noticiaEl;
    var layout = n.imagem ? (prog.config.noticiasLayout || 'jornal') : 'destaque';
    el.classList.remove('layout-jornal', 'layout-manchete', 'layout-destaque', 'rodando', 'sem-link');
    el.classList.add('layout-' + layout);
    if (!n.url) el.classList.add('sem-link');
    el.style.setProperty('--seg', segundosNoticia() + 's');
    var foto = el.querySelector('.not-foto'), img = foto.querySelector('img');
    foto.classList.remove('conter');
    img.onload = null;
    img.onerror = null;
    if (layout !== 'destaque') {
      // foto com formato muito diferente do espaço (um cartaz largo, por exemplo) aparece inteira, sem corte
      img.onload = function () {
        var caixa = foto.getBoundingClientRect();
        var ri = img.naturalWidth / img.naturalHeight, rc = caixa.width / Math.max(1, caixa.height);
        if (ri / rc > 1.35 || rc / ri > 1.35) foto.classList.add('conter');
      };
      img.onerror = function () { el.classList.remove('layout-' + layout); el.classList.add('layout-destaque'); };
      img.src = n.imagem;
    } else {
      img.removeAttribute('src');
    }
    el.querySelector('.not-rotulo').textContent = total > 1 ? 'Notícia ' + pos + ' de ' + total : 'Notícia';
    el.querySelector('.not-fonte').textContent = n.fonte || '';
    el.querySelector('.not-data').textContent = n.data ? dataPorExtenso(n.data) : '';
    var t = el.querySelector('.not-titulo');
    t.textContent = n.titulo;
    t.className = 'not-titulo ' + (n.titulo.length <= 45 ? 'n-g' : n.titulo.length <= 80 ? 'n-m' : 'n-p');
    el.querySelector('.not-resumo').textContent = n.resumo || '';
    el.querySelector('.not-qr').innerHTML = qrSvg(n.url);
    void el.offsetWidth;
    el.classList.add('rodando');
  }

  function mostrarNoticias(lote, depois) {
    clearTimeout(tv.timer);
    video.pause();
    esconder(vinheta); esconder(aviso); esconder(agenda);
    var i = 0;
    (function passo() {
      if (i >= lote.length) {
        tv.noticiaId = null;
        esconder(noticiaEl);
        depois();
        return;
      }
      var n = lote[i];
      tv.fase = 'noticia';
      tv.noticiaId = n.id;
      desenharCartao(n, i + 1, lote.length);
      mostrar(noticiaEl);
      i++;
      batida();
      tv.timer = setTimeout(passo, segundosNoticia() * 1000);
    })();
  }

  function exibirNoticia(id) {
    var n = porIdNoticia(id);
    if (n) { tv.forcado = true; mostrarNoticias([n], function () { proximo(); }); return; }
    carregarProgramacao().then(function () {
      var m = porIdNoticia(id);
      if (m) { tv.forcado = true; mostrarNoticias([m], function () { proximo(); }); }
    });
  }

  // ---------- horário ----------
  function dentroDoHorario() {
    var c = prog.config || {};
    if (!c.liga || !c.desliga) return true;
    var agora = new Date();
    var dias = Array.isArray(c.dias) && c.dias.length ? c.dias : [0, 1, 2, 3, 4, 5, 6];
    if (dias.indexOf(agora.getDay()) < 0) return false;
    var hm = String(agora.getHours()).padStart(2, '0') + ':' + String(agora.getMinutes()).padStart(2, '0');
    return hm >= c.liga && hm < c.desliga;
  }

  function foraDoHorario() {
    clearTimeout(tv.timer);
    pararVideo();
    tv.fase = 'fora';
    tv.atualId = null;
    tv.forcado = false;
    esconder(vinheta); esconder(aviso); esconder(agenda); esconder(noticiaEl);
    batida();
  }

  setInterval(function () {
    var dentro = dentroDoHorario();
    if (tv.fase === 'fora' && dentro) proximo();
    else if (tv.fase !== 'fora' && tv.fase !== 'config' && !dentro && !tv.forcado) foraDoHorario();
  }, 30000);

  // ---------- comunicação com a administração ----------
  function batida() {
    if (!conf.api || !conf.chave) return;
    var avisos = [];
    if (tv.avisoSom) avisos.push('O navegador bloqueou o som, e a TV está no mudo.');
    if (baixa.semEspaco) avisos.push('Falta espaço para guardar todos os vídeos; alguns tocam direto da internet.');
    if (tv.erroProgramacao) avisos.push(tv.erroProgramacao);
    var marcados = prog.videos.filter(function (v) { return v.ativo !== false; });
    var atual = porId(tv.atualId);
    var proporcao = window.devicePixelRatio || 1;
    var dados = {
      api: 'status', chave: conf.chave, fase: tv.fase, id: (tv.fase === 'noticia' ? tv.noticiaId : tv.atualId) || '',
      pos: Math.round(tv.fase === 'video' ? video.currentTime || 0 : 0),
      dur: Math.round(isFinite(video.duration) && video.duration > 0 && tv.fase === 'video' ? video.duration : (atual && atual.duracao) || 0),
      prontos: marcados.filter(function (v) { return baixa.prontos[v.id]; }).length,
      total: marcados.length,
      baixando: baixa.atual || '',
      pct: baixa.pct,
      falhas: Object.keys(tv.falhas).filter(falhou).join(','),
      aviso: avisos.join(' '),
      tela: Math.round(screen.width * proporcao) + 'x' + Math.round(screen.height * proporcao)
    };
    fetch(endereco(dados), { cache: 'no-store' })
      .then(function (r) { return r.json(); })
      .then(function (r) {
        if (!r) return;
        if (r.versao && r.versao !== prog.versao) carregarProgramacao();
        if (r.comando) executar(r.comando);
      })
      .catch(function () { /* sem internet: segue tocando o que já tem */ });
  }

  function executar(c) {
    if (c.acao === 'exibir' && c.id) {
      if (porId(c.id)) proximo(c.id);
      else carregarProgramacao().then(function () { if (porId(c.id)) proximo(c.id); });
    } else if (c.acao === 'exibir-noticia' && c.id) {
      exibirNoticia(c.id);
    } else if (c.acao === 'proximo') {
      proximo();
    } else if (c.acao === 'recarregar') {
      location.reload();
    }
  }

  // ---------- cópias guardadas no aparelho ----------
  function sincronizarCache() {
    if (!('caches' in window) || !prog.config.driveApiKey) return;
    caches.open(CACHE).then(function (cache) {
      var validas = prog.videos.map(function (v) { return chaveCache(v).url; });
      return cache.keys()
        .then(function (chaves) {
          return Promise.all(chaves.map(function (k) { return validas.indexOf(k.url) < 0 ? cache.delete(k) : null; }));
        })
        .then(function () {
          return Promise.all(prog.videos.map(function (v) {
            return cache.match(chaveCache(v)).then(function (r) {
              if (r) baixa.prontos[v.id] = true; else delete baixa.prontos[v.id];
            });
          }));
        });
    }).then(baixarProximo).catch(function () {});
  }

  function baixarProximo() {
    if (baixa.ocupado || baixa.semEspaco || !('caches' in window)) return;
    var falta = prog.videos.filter(function (v) {
      return v.ativo !== false && !baixa.prontos[v.id] && !(baixa.erros[v.id] > Date.now());
    });
    if (!falta.length) return;
    var v = falta[0];
    baixa.ocupado = true;
    baixa.atual = v.id;
    baixa.pct = 0;
    baixar(v)
      .then(function () { baixa.prontos[v.id] = true; })
      .catch(function (e) {
        if (e && (e.name === 'QuotaExceededError' || /quota/i.test(e.message || ''))) baixa.semEspaco = true;
        else baixa.erros[v.id] = Date.now() + 10 * 60000;
      })
      .then(function () {
        baixa.ocupado = false;
        baixa.atual = null;
        baixa.pct = 0;
        baixarProximo();
      });
  }

  function baixar(v) {
    return fetch(urlDrive(v.id)).then(function (resp) {
      if (!resp.ok) throw new Error('HTTP ' + resp.status);
      var total = Number(resp.headers.get('Content-Length')) || v.tamanho || 0;
      var copia = resp;
      if (resp.body && typeof TransformStream === 'function') {
        var recebidos = 0;
        copia = new Response(resp.body.pipeThrough(new TransformStream({
          transform: function (pedaco, ctrl) {
            recebidos += pedaco.byteLength;
            if (total) baixa.pct = Math.min(99, Math.floor(recebidos / total * 100));
            ctrl.enqueue(pedaco);
          }
        })), { headers: { 'Content-Type': resp.headers.get('Content-Type') || 'video/mp4' } });
      }
      return caches.open(CACHE).then(function (c) { return c.put(chaveCache(v), copia); });
    });
  }

  // ---------- aparelho ----------
  function aoInteragir() {
    var el = document.documentElement;
    if (!document.fullscreenElement && el.requestFullscreen) el.requestFullscreen().catch(function () {});
    if (prog.config.som && video.muted && tv.fase === 'video') { video.muted = false; tv.avisoSom = false; }
  }
  document.addEventListener('keydown', aoInteragir);
  document.addEventListener('click', aoInteragir);

  var trava = null;
  function manterTelaAcesa() {
    if (!navigator.wakeLock || trava) return;
    navigator.wakeLock.request('screen').then(function (t) {
      trava = t;
      t.addEventListener('release', function () { trava = null; });
    }).catch(function () {});
  }
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible') manterTelaAcesa(); });

  // recarrega de madrugada a cada dia, para a página nunca ficar dias aberta sem renovar
  setInterval(function () {
    if (Date.now() - inicio > 20 * 3600000 && new Date().getHours() === 4) location.reload();
  }, 10 * 60000);

  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(function () {});
  manterTelaAcesa();
  carregarProgramacao();
  setInterval(batida, BATIDA_MS);
  setInterval(carregarProgramacao, PROGRAMACAO_MS);
})();
</script>
</body>
</html>
